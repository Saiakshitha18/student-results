# ==========================================
# Application
# ==========================================
spring.application.name=student-results

# ==========================================
# Server
# ==========================================
server.port=8080

# ==========================================
# MySQL Database
# ==========================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/myappdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Don't keep DB connection open beyond service/repository layer
spring.jpa.open-in-view=false